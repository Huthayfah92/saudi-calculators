<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة التمويل العقاري | حساب القسط الشهري</title>
<meta name="description" content="احسب القسط الشهري للتمويل العقاري بناءً على مبلغ العقار، الدفعة الأولى، مدة التمويل ونسبة الربح.">
<style>
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#0f172a;color:white;padding:32px 20px;text-align:center}
nav{background:#111827;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:8px;display:inline-block}
.container{max-width:850px;margin:auto;padding:20px}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
label{font-weight:bold;display:block;margin-top:12px}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#2563eb;color:white}
.result{background:#f1f5f9;padding:16px;border-radius:10px;margin-top:16px;font-weight:bold;line-height:1.9}
</style>
</head>

<body>

<header>
<h1>حاسبة التمويل العقاري</h1>
<p>احسب القسط الشهري التقريبي لتمويلك العقاري</p>
</header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="mortgage.html">التمويل العقاري</a>
</nav>

<div class="container">
<div class="card">

<label>سعر العقار</label>
<input id="property" type="number" placeholder="مثال: 1000000">

<label>الدفعة الأولى</label>
<input id="down" type="number" placeholder="مثال: 100000">

<label>مدة التمويل بالسنوات</label>
<input id="years" type="number" placeholder="مثال: 25">

<label>نسبة الربح السنوية (%)</label>
<input id="rate" type="number" placeholder="مثال: 4">

<button onclick="calc()">احسب التمويل العقاري</button>

<div id="result" class="result"></div>

</div>
</div>

<script>
function format(n){return Math.round(n).toLocaleString("ar-SA")}

function calc(){
let property=Number(document.getElementById("property").value)||0;
let down=Number(document.getElementById("down").value)||0;
let years=Number(document.getElementById("years").value)||0;
let rate=Number(document.getElementById("rate").value)||0;

let amount=property-down;
let months=years*12;

if(months<=0){
document.getElementById("result").innerHTML="أدخل مدة صحيحة.";
return;
}

let profit=amount*(rate/100)*years;
let total=amount+profit;
let monthly=total/months;

document.getElementById("result").innerHTML =
`مبلغ التمويل: ${format(amount)} ريال<br>
إجمالي الربح التقريبي: ${format(profit)} ريال<br>
إجمالي السداد: ${format(total)} ريال<br>
القسط الشهري التقريبي: ${format(monthly)} ريال`;
}
</script>

</body>
</html>
