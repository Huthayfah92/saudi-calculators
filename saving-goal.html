<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الادخار لهدف مالي | كم تحتاج لتصل لهدفك؟</title>
<meta name="description" content="احسب المبلغ الشهري المطلوب للوصول إلى هدفك المالي خلال مدة محددة.">
<style>
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#0f172a;color:white;padding:32px 20px;text-align:center}
nav{background:#111827;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:8px;display:inline-block}
.container{max-width:850px;margin:auto;padding:20px}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
label{font-weight:bold;display:block;margin-top:12px}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#2563eb;color:white}
.result{background:#f1f5f9;padding:16px;border-radius:10px;margin-top:16px;font-weight:bold;line-height:1.9}
</style>
</head>

<body>

<header>
<h1>حاسبة الادخار لهدف مالي</h1>
<p>اعرف كم تحتاج تدخر شهريًا للوصول لهدفك</p>
</header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="saving-goal.html">الادخار لهدف مالي</a>
</nav>

<div class="container">
<div class="card">

<label>المبلغ المستهدف</label>
<input id="goal" type="number" placeholder="مثال: 100000">

<label>عدد السنوات</label>
<input id="years" type="number" placeholder="مثال: 5">

<button onclick="calc()">احسب</button>

<div id="result" class="result"></div>

</div>
</div>

<script>
function format(n){
return Math.round(n).toLocaleString("ar-SA");
}

function calc(){

let goal = Number(document.getElementById("goal").value) || 0;
let years = Number(document.getElementById("years").value) || 0;

let months = years * 12;

if(months <= 0){
document.getElementById("result").innerHTML = "أدخل مدة صحيحة.";
return;
}

let monthly = goal / months;

document.getElementById("result").innerHTML =
`المبلغ المطلوب ادخاره شهريًا: ${format(monthly)} ريال<br>
للوصول إلى هدف بقيمة ${format(goal)} ريال خلال ${years} سنوات.`;

}
</script>

</body>
