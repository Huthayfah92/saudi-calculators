<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة العائد المركب | احسب نمو استثماراتك</title>
<meta name="description" content="حاسبة العائد المركب تساعدك على معرفة القيمة المستقبلية لاستثماراتك مع الإضافات الشهرية.">
<style>
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#0f172a;color:white;padding:32px 20px;text-align:center}
nav{background:#111827;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:8px;display:inline-block}
.container{max-width:850px;margin:auto;padding:20px}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:22px}
label{font-weight:bold;display:block;margin-top:12px}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#2563eb;color:white}
.result{background:#f1f5f9;padding:16px;border-radius:10px;margin-top:16px;font-weight:bold;line-height:1.9}
</style>
</head>
<body>

<header>
<h1>حاسبة العائد المركب</h1>
<p>اعرف كيف ينمو استثمارك مع مرور الوقت</p>
</header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="compound-interest.html">العائد المركب</a>
</nav>

<div class="container">

<div class="card">

<label>رأس المال الحالي</label>
<input id="initial" type="number" placeholder="10000">

<label>الإضافة الشهرية</label>
<input id="monthly" type="number" placeholder="500">

<label>عدد السنوات</label>
<input id="years" type="number" placeholder="15">

<label>العائد السنوي (%)</label>
<input id="rate" type="number" placeholder="10">

<button onclick="calc()">احسب</button>

<div id="result" class="result"></div>

</div>

</div>

<script>
function format(n){
return Math.round(n).toLocaleString("ar-SA");
}

function calc(){

let initial = Number(document.getElementById("initial").value)||0;
let monthly = Number(document.getElementById("monthly").value)||0;
let years = Number(document.getElementById("years").value)||0;
let annualRate = Number(document.getElementById("rate").value)||0;

let months = years * 12;
let r = annualRate / 100 / 12;

let future = initial;

for(let i=0;i<months;i++){
future = (future + monthly) * (1+r);
}

let invested = initial + (monthly * months);
let profit = future - invested;

document.getElementById("result").innerHTML =
`إجمالي المبلغ المستثمر: ${format(invested)} ريال<br>
الأرباح المتوقعة: ${format(profit)} ريال<br>
القيمة النهائية: ${format(future)} ريال`;

}
</script>

</body>
</html>
